<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/site.css"/>  
    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />    
    <script src="https://js.arcgis.com/4.29/"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ionic-native/device-orientation/dist/index.js"></script>

    <!-- Favico-->
    <link rel="icon" href="images/white_logo.png" type="image/x-icon">
</head>

<body>
    <div class="container-fluid mt-3 bg-success">

        <div class="row">
            <div class="col">
                <div class=" align-items-center">
                    <div class="row">
                        <div class="col col-10">
                            <div class="row">
                                <div class="col col-12">
                                    <h3 class="text-white p-3 mb-0">Coral Gables Santa's Routes</h3>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col col-12">
        
                                    <ul class="nav nav-pills me-auto mb-0">
                                        <li class="nav-item">
                                            <a class="nav-link" href="index.html">
                                                <span class="text-white">Home</span>
                                            </a>
                                        </li>
                                        <li class="nav-item dropdown">
                                            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
                                                <span class="text-white">Santas Routes</span>
                                            </a>
                                            <ul class="dropdown-menu">
                                                <li><a class="dropdown-item text-success" href="truck.html">Track Santa's Route</a></li>                                                                                             
                                            </ul>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" href="about.html">
                                                <span class="text-white">About</span>
                                            </a>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" href="index.html">
                                                <span class="text-white">Contact Us</span>
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>                    
                        <div class="col col-2 d-flex justify-content-end">
                            <img src="images/white_logo.png" alt="Logo" class="ms-auto p-2" style="height: 100px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="container-fluid mt-3 d-flex justify-content-center">
        <div class="row">
            <div class="col d-flex justify-content-start">
                <div id="startTracking" class="btn btn-success">Start Tracking</div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center align-items-center" style="height: calc(100vh - 200px);">
        <div id="viewDiv"></div>
               
    </div>
	
	<div class="container mt-3 bg-success"
        style="background: linear-gradient(to right, rgba(8, 202, 8, 0.6), rgba(62, 129, 65, 0.9));">
        <div class="row m-5 p-5">
            <div class="col">
                <h5 class="text-center">
                    <span class="text-white">Remember, if Santa has been in the same place for a long time, he might be taking a break....</span>
                </h5>
            </div>
        </div>
    </div>

    <footer class="m-5">
        <p class="text-white text-center">&copy; 2024 Coral Gables Santa's Route. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@ionic-native/device-orientation/dist/index.js"></script>

    <script src="js/app.js"></script>
</body>
</html>
